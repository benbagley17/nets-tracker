name: Fetch Nets Stats & Deploy
on:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ hashFiles('r/fetch_nets_stats.R') }}
          restore-keys: r-pkgs-

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")
          pak::pak(c(
            "sportsdataverse/hoopR",
            "dplyr",
            "jsonlite",
            "purrr",
            "lubridate",
            "cli",
            "tibble"
          ))

      - name: Run fetch script
        shell: Rscript {0}
        run: |
          source("r/fetch_nets_stats.R")

      - name: Commit updated live_stats.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/live_stats.json
          git stash
          git pull --rebase origin main
          git stash pop
          git diff --staged --quiet && git add -f public/data/live_stats.json
          git diff --staged --quiet || git commit -m "chore: update live_stats.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push origin main

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "deploy: ${{ github.sha }}"
