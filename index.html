<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brooklyn Nets — Milestone Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --white: #f5f3ee;
    --gray-1: #141414;
    --gray-2: #1e1e1e;
    --gray-3: #2a2a2a;
    --gray-4: #444;
    --gray-5: #888;
    --gray-6: #bbb;
    --urgent: #e8473f;
    --close: #e8973f;
    --upcoming: #4a9eff;
    --achieved: #3fcf8e;
    --border: rgba(255,255,255,0.07);
    --card-bg: #111;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--black); color:var(--white); font-family:'DM Sans',sans-serif; min-height:100vh; overflow-x:hidden; }

  header {
    border-bottom:1px solid var(--border);
    padding:0 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:72px;
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(10,10,10,0.92);
    backdrop-filter:blur(12px);
  }
  .logo { display:flex; align-items:baseline; gap:12px; }
  .logo-brk { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:3px; }
  .logo-sub { font-family:'DM Mono',monospace; font-size:11px; color:var(--gray-5); letter-spacing:2px; text-transform:uppercase; }
  .header-right { display:flex; align-items:center; gap:16px; }
  .data-badge { font-family:'DM Mono',monospace; font-size:10px; color:var(--gray-5); letter-spacing:1px; display:flex; align-items:center; gap:6px; }
  .data-badge .dot { width:6px; height:6px; border-radius:50%; background:var(--achieved); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .summary-strip { display:flex; border-bottom:1px solid var(--border); overflow-x:auto; }
  .summary-tile { flex:1; min-width:100px; padding:18px 28px; border-right:1px solid var(--border); cursor:pointer; transition:background 0.15s; }
  .summary-tile:last-child { border-right:none; }
  .summary-tile:hover { background:var(--gray-1); }
  .summary-tile.active { background:var(--gray-2); }
  .summary-count { font-family:'Bebas Neue',sans-serif; font-size:34px; line-height:1; margin-bottom:3px; }
  .summary-label { font-size:11px; color:var(--gray-5); letter-spacing:1.5px; text-transform:uppercase; font-weight:500; }
  .tile-urgent .summary-count   { color:var(--urgent); }
  .tile-close .summary-count    { color:var(--close); }
  .tile-upcoming .summary-count { color:var(--upcoming); }
  .tile-achieved .summary-count { color:var(--achieved); }

  .controls { padding:16px 40px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .controls-label { font-size:11px; color:var(--gray-5); letter-spacing:1.5px; text-transform:uppercase; }
  .filter-btn { background:transparent; border:1px solid var(--gray-3); color:var(--gray-6); padding:5px 12px; border-radius:3px; font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; transition:all 0.15s; }
  .filter-btn:hover { border-color:var(--gray-5); color:var(--white); }
  .filter-btn.active { background:var(--white); border-color:var(--white); color:var(--black); font-weight:600; }
  .divider { width:1px; height:18px; background:var(--border); }

  main { padding:28px 40px; display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:14px; }

  .card { background:var(--card-bg); border:1px solid var(--border); border-radius:6px; overflow:hidden; transition:transform 0.15s,border-color 0.15s; cursor:pointer; }
  .card:hover { transform:translateY(-2px); border-color:rgba(255,255,255,0.14); }
  .card-accent { height:3px; }
  .card.urgent .card-accent   { background:var(--urgent); }
  .card.close .card-accent    { background:var(--close); }
  .card.upcoming .card-accent { background:var(--upcoming); }
  .card.achieved .card-accent { background:var(--achieved); }

  .card-header { padding:16px 20px 12px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card-player { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px; line-height:1; }
  .card-stat-type { font-size:11px; color:var(--gray-5); letter-spacing:1.5px; text-transform:uppercase; margin-top:3px; }
  .urgency-badge { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; padding:3px 8px; border-radius:3px; white-space:nowrap; flex-shrink:0; }
  .card.urgent .urgency-badge   { background:rgba(232,71,63,0.15);  color:var(--urgent); }
  .card.close .urgency-badge    { background:rgba(232,151,63,0.15); color:var(--close); }
  .card.upcoming .urgency-badge { background:rgba(74,158,255,0.15); color:var(--upcoming); }
  .card.achieved .urgency-badge { background:rgba(63,207,142,0.15); color:var(--achieved); }

  .card-progress { padding:0 20px 14px; }
  .progress-nums { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .progress-current { font-family:'Bebas Neue',sans-serif; font-size:30px; line-height:1; }
  .progress-target { font-family:'DM Mono',monospace; font-size:12px; color:var(--gray-5); }
  .progress-bar-track { height:4px; background:var(--gray-2); border-radius:2px; overflow:hidden; }
  .progress-bar-fill { height:100%; border-radius:2px; width:0%; transition:width 0.8s cubic-bezier(0.16,1,0.3,1); }
  .card.urgent .progress-bar-fill   { background:var(--urgent); }
  .card.close .progress-bar-fill    { background:var(--close); }
  .card.upcoming .progress-bar-fill { background:var(--upcoming); }
  .card.achieved .progress-bar-fill { background:var(--achieved); }
  .progress-footer { display:flex; justify-content:space-between; margin-top:7px; font-family:'DM Mono',monospace; font-size:11px; color:var(--gray-5); }

  .card-details { display:none; padding:0 20px 16px; border-top:1px solid var(--border); margin-top:2px; }
  .card.expanded .card-details { display:block; }
  .media-alert { padding:12px; background:var(--gray-1); border-radius:4px; border-left:3px solid var(--gray-3); margin-top:12px; }
  .media-alert-label { font-family:'DM Mono',monospace; font-size:9px; color:var(--gray-5); letter-spacing:2px; text-transform:uppercase; margin-bottom:7px; }
  .media-alert-text { font-size:13px; line-height:1.6; color:var(--gray-6); }
  .card-actions { display:flex; gap:8px; margin-top:10px; }
  .btn-slack { background:transparent; border:1px solid var(--gray-3); color:var(--gray-6); padding:6px 12px; border-radius:3px; font-family:'DM Mono',monospace; font-size:11px; cursor:pointer; transition:all 0.15s; }
  .btn-slack:hover { border-color:var(--achieved); color:var(--achieved); }

  .slack-panel { position:fixed; right:0; top:72px; bottom:0; width:320px; background:var(--gray-1); border-left:1px solid var(--border); padding:24px 22px; transform:translateX(100%); transition:transform 0.25s cubic-bezier(0.16,1,0.3,1); z-index:90; overflow-y:auto; }
  .slack-panel.open { transform:translateX(0); }
  .slack-panel-title { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; margin-bottom:6px; }
  .slack-panel-sub { font-size:12px; color:var(--gray-5); margin-bottom:22px; line-height:1.5; }
  .slack-label { font-size:11px; color:var(--gray-5); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; display:block; }
  .slack-input { width:100%; background:var(--gray-2); border:1px solid var(--gray-3); color:var(--white); padding:9px 11px; border-radius:4px; font-family:'DM Mono',monospace; font-size:12px; margin-bottom:14px; outline:none; transition:border-color 0.15s; }
  .slack-input:focus { border-color:var(--gray-5); }
  .slack-select { width:100%; background:var(--gray-2); border:1px solid var(--gray-3); color:var(--white); padding:8px 10px; border-radius:4px; font-family:'DM Mono',monospace; font-size:12px; margin-bottom:14px; outline:none; }
  .slack-save { width:100%; background:var(--white); color:var(--black); border:none; padding:10px; border-radius:4px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:13px; cursor:pointer; margin-bottom:8px; transition:opacity 0.15s; }
  .slack-save:hover { opacity:0.85; }
  .slack-status { font-family:'DM Mono',monospace; font-size:11px; color:var(--achieved); display:none; margin-bottom:14px; }
  .slack-test { width:100%; }

  .slack-open-btn { background:transparent; border:1px solid var(--gray-3); color:var(--gray-5); padding:6px 12px; border-radius:3px; font-family:'DM Mono',monospace; font-size:11px; cursor:pointer; transition:all 0.15s; }
  .slack-open-btn:hover { border-color:var(--gray-5); color:var(--white); }

  .empty-state { grid-column:1/-1; text-align:center; padding:80px 20px; color:var(--gray-5); }
  .empty-state-icon { font-size:40px; margin-bottom:14px; opacity:0.4; }

  footer { padding:20px 40px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; font-family:'DM Mono',monospace; font-size:11px; color:var(--gray-5); }

  #loading { display:flex; align-items:center; justify-content:center; height:60vh; font-family:'DM Mono',monospace; font-size:12px; color:var(--gray-5); letter-spacing:2px; }

  @media(max-width:700px){
    header{padding:0 20px;}
    main{padding:16px 20px;grid-template-columns:1fr;}
    .controls{padding:14px 20px;}
    .summary-tile{padding:14px 16px;}
    .slack-panel{width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-brk">BKN</span>
    <span class="logo-sub">Milestone Tracker</span>
  </div>
  <div class="header-right">
    <div class="data-badge">
      <span class="dot"></span>
      <span id="data-timestamp">Loading...</span>
    </div>
    <button class="slack-open-btn" onclick="toggleSlack()">⚡ Slack Alerts</button>
  </div>
</header>

<div class="summary-strip">
  <div class="summary-tile tile-all active" onclick="setUrgency('all')">
    <div class="summary-count" id="count-all">—</div>
    <div class="summary-label">All</div>
  </div>
  <div class="summary-tile tile-urgent" onclick="setUrgency('urgent')">
    <div class="summary-count" id="count-urgent">—</div>
    <div class="summary-label">Urgent</div>
  </div>
  <div class="summary-tile tile-close" onclick="setUrgency('close')">
    <div class="summary-count" id="count-close">—</div>
    <div class="summary-label">Close</div>
  </div>
  <div class="summary-tile tile-upcoming" onclick="setUrgency('upcoming')">
    <div class="summary-count" id="count-upcoming">—</div>
    <div class="summary-label">Upcoming</div>
  </div>
  <div class="summary-tile tile-achieved" onclick="setUrgency('achieved')">
    <div class="summary-count" id="count-achieved">—</div>
    <div class="summary-label">Achieved</div>
  </div>
</div>

<div class="controls" id="player-filters">
  <span class="controls-label">Player</span>
  <button class="filter-btn active" onclick="setPlayer('all',this)">All</button>
  <div class="divider"></div>
</div>

<div id="loading">LOADING DATA...</div>
<main id="grid" style="display:none"></main>

<footer>
  <span>Brooklyn Nets · Media Intelligence · 2026-27</span>
  <span id="footer-source"></span>
</footer>

<div class="slack-panel" id="slack-panel">
  <div class="slack-panel-title">Slack Alerts</div>
  <div class="slack-panel-sub">Get notified when a milestone enters your alert window. Each alert fires once per session.</div>
  <label class="slack-label">Webhook URL</label>
  <input class="slack-input" id="slack-webhook" type="text" placeholder="https://hooks.slack.com/services/...">
  <label class="slack-label">Alert threshold</label>
  <select class="slack-select" id="slack-threshold">
    <option value="5">5 games away</option>
    <option value="10" selected>10 games away</option>
    <option value="20">20 games away</option>
    <option value="30">30 games away</option>
  </select>
  <button class="slack-save" onclick="saveSlack()">Save Configuration</button>
  <div class="slack-status" id="slack-status">✓ Saved</div>
  <label class="slack-label">Test</label>
  <button class="btn-slack slack-test" onclick="testSlack()">Send test message to Slack</button>
</div>

<script>
  let allMilestones = [];
  let PLAYER_NAMES = {};
  let activeUrgency = 'all';
  let activePlayer = 'all';
  let sentAlerts = new Set(JSON.parse(localStorage.getItem('sentAlerts') || '[]'));

  const URGENCY_ORDER = { urgent:0, close:1, upcoming:2, achieved:3 };
  const URGENCY_LABEL = { urgent:'🔴 Urgent', close:'🟡 Close', upcoming:'🔵 Upcoming', achieved:'✅ Achieved' };

  async function loadData() {
    try {
      const res = await fetch('data/live_stats.json?t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      (data.roster || []).forEach(p => { PLAYER_NAMES[p.id] = p.name; });
      allMilestones = data.milestones || [];

      const ts = data.meta && data.meta.generated_at;
      if (ts) {
        const d = new Date(ts);
        document.getElementById('data-timestamp').textContent =
          'Updated ' + d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) +
          ' ' + d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
      }
      document.getElementById('footer-source').textContent = (data.meta && data.meta.source) || '';

      buildPlayerFilters();
      updateCounts();
      renderGrid();
      checkSlackAlerts();

      document.getElementById('loading').style.display = 'none';
      document.getElementById('grid').style.display = 'grid';
    } catch(e) {
      document.getElementById('loading').textContent = 'Failed to load data — ' + e.message;
      console.error(e);
    }
  }

  function buildPlayerFilters() {
    const container = document.getElementById('player-filters');
    const players = [...new Set(allMilestones.map(m => m.player))];
    players.forEach(pid => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      const name = PLAYER_NAMES[pid] || pid;
      btn.textContent = name.split(' ').slice(-1)[0]; // last name only
      btn.onclick = () => setPlayer(pid, btn);
      container.appendChild(btn);
    });
  }

  function setUrgency(u) {
    activeUrgency = u;
    document.querySelectorAll('.summary-tile').forEach(t => t.classList.remove('active'));
    const sel = u === 'all' ? '.tile-all' : '.tile-' + u;
    const el = document.querySelector(sel);
    if (el) el.classList.add('active');
    renderGrid();
  }

  function setPlayer(pid, btn) {
    activePlayer = pid;
    document.querySelectorAll('#player-filters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  }

  function getFiltered() {
    return allMilestones.filter(m => {
      const uOk = activeUrgency === 'all' || m.urgency === activeUrgency;
      const pOk = activePlayer === 'all' || m.player === activePlayer;
      return uOk && pOk;
    });
  }

  function updateCounts() {
    const c = { urgent:0, close:0, upcoming:0, achieved:0 };
    allMilestones.forEach(m => { if (c[m.urgency] !== undefined) c[m.urgency]++; });
    document.getElementById('count-all').textContent = allMilestones.length;
    document.getElementById('count-urgent').textContent = c.urgent;
    document.getElementById('count-close').textContent = c.close;
    document.getElementById('count-upcoming').textContent = c.upcoming;
    document.getElementById('count-achieved').textContent = c.achieved;
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    const list = getFiltered().sort((a,b) =>
      (URGENCY_ORDER[a.urgency] ?? 4) - (URGENCY_ORDER[b.urgency] ?? 4) ||
      (a.gamesAway ?? 9999) - (b.gamesAway ?? 9999)
    );

    if (!list.length) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">◎</div><div>No milestones match this filter.</div></div>';
      return;
    }

    grid.innerHTML = list.map(m => {
      const name = PLAYER_NAMES[m.player] || m.player;
      const pct  = Math.min(100, Math.round(m.current / m.target * 100));
      const gamesTxt = m.urgency === 'achieved'
        ? 'Already achieved'
        : m.gamesAway != null ? m.gamesAway + ' games into 2026-27' : '—';
      return `<div class="card ${m.urgency}" id="card-${m.id}" onclick="toggleCard('${m.id}')">
        <div class="card-accent"></div>
        <div class="card-header">
          <div>
            <div class="card-player">${name}</div>
            <div class="card-stat-type">${m.statType}</div>
          </div>
          <div class="urgency-badge">${URGENCY_LABEL[m.urgency] || m.urgency}</div>
        </div>
        <div class="card-progress">
          <div class="progress-nums">
            <span class="progress-current">${m.current.toLocaleString()}</span>
            <span class="progress-target">of ${m.target.toLocaleString()}</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" data-pct="${pct}" style="width:0%"></div>
          </div>
          <div class="progress-footer">
            <span>${m.remaining.toLocaleString()} remaining</span>
            <span>${gamesTxt}</span>
          </div>
        </div>
        <div class="card-details">
          <div class="media-alert">
            <div class="media-alert-label">📋 Media Alert Copy</div>
            <div class="media-alert-text">${m.mediaAlert || '—'}</div>
          </div>
          <div class="card-actions">
            <button class="btn-slack" onclick="event.stopPropagation();sendSlackAlert('${m.id}',true)">↗ Test Slack Alert</button>
          </div>
        </div>
      </div>`;
    }).join('');

    requestAnimationFrame(() => {
      document.querySelectorAll('.progress-bar-fill').forEach(bar => {
        bar.style.width = bar.dataset.pct + '%';
      });
    });
  }

  function toggleCard(id) {
    document.getElementById('card-' + id).classList.toggle('expanded');
  }

  function toggleSlack() {
    const panel = document.getElementById('slack-panel');
    panel.classList.toggle('open');
    document.getElementById('slack-webhook').value = localStorage.getItem('slackWebhook') || '';
    document.getElementById('slack-threshold').value = localStorage.getItem('slackThreshold') || '10';
  }

  function saveSlack() {
    localStorage.setItem('slackWebhook', document.getElementById('slack-webhook').value.trim());
    localStorage.setItem('slackThreshold', document.getElementById('slack-threshold').value);
    const s = document.getElementById('slack-status');
    s.style.display = 'block';
    setTimeout(() => s.style.display = 'none', 2500);
  }

  function testSlack() {
    const wh = localStorage.getItem('slackWebhook');
    if (!wh) { alert('Save a webhook URL first.'); return; }
    postSlack(wh, { text: '🏀 *Nets Milestone Tracker* — test alert. Slack integration is working.' });
  }

  function checkSlackAlerts() {
    const wh  = localStorage.getItem('slackWebhook');
    const thr = parseInt(localStorage.getItem('slackThreshold') || '10');
    if (!wh) return;
    allMilestones.forEach(m => {
      if (sentAlerts.has(m.id) || m.urgency === 'achieved') return;
      if (m.gamesAway != null && m.gamesAway <= thr) sendSlackAlert(m.id, false);
    });
  }

  function sendSlackAlert(id, isTest) {
    const wh = localStorage.getItem('slackWebhook');
    if (!wh) { alert('Configure a Slack webhook first.'); return; }
    const m    = allMilestones.find(x => x.id === id);
    const name = PLAYER_NAMES[m && m.player] || (m && m.player) || id;
    const text = isTest
      ? `🏀 *TEST — ${name}* | ${m.statType}\n${m.current.toLocaleString()} / ${m.target.toLocaleString()} — ${m.gamesAway ?? '?'} games away\n\n_${m.mediaAlert || ''}_`
      : `🚨 *MILESTONE ALERT — ${name}*\n${m.statType}: ${m.current.toLocaleString()} / ${m.target.toLocaleString()}\n📅 ${m.gamesAway ?? '?'} games into 2026-27\n\n_${m.mediaAlert || ''}_`;
    postSlack(wh, { text });
    if (!isTest) {
      sentAlerts.add(id);
      localStorage.setItem('sentAlerts', JSON.stringify([...sentAlerts]));
    }
  }

  function postSlack(url, payload) {
    fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })
      .catch(e => console.warn('Slack error:', e));
  }

  loadData();
</script>
</body>
</html>
