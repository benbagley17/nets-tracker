<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upcoming Milestones</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f5f5f3;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:13px;min-height:100vh;}

/* ── TOOLBAR ── */
.toolbar{background:#0a0a0a;color:#f5f3ee;padding:11px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
.toolbar-logo{font-size:14px;font-weight:700;letter-spacing:3px;white-space:nowrap;}
.tb-divider{width:1px;height:16px;background:rgba(255,255,255,0.15);margin:0 2px;flex-shrink:0;}
.tb-section{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.tb-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#666;white-space:nowrap;}
.tb-chip{padding:3px 8px;border:1px solid #2a2a2a;border-radius:3px;font-size:10px;cursor:pointer;color:#888;background:transparent;transition:all 0.15s;white-space:nowrap;font-family:inherit;line-height:1.6;}
.tb-chip:hover{border-color:#555;color:#ddd;}
.tb-chip.on{background:#fff;color:#0a0a0a;border-color:#fff;font-weight:600;}
.tb-chip.on.urgent{background:#e8473f;border-color:#e8473f;color:#fff;}
.tb-chip.on.close{background:#e8973f;border-color:#e8973f;color:#fff;}
.tb-chip.on.upcoming{background:#4a9eff;border-color:#4a9eff;color:#fff;}
.tb-chip.on.achieved{background:#3fcf8e;border-color:#3fcf8e;color:#fff;}
.print-btn{margin-left:auto;padding:6px 14px;background:#fff;color:#0a0a0a;border:none;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;}
.print-btn:hover{background:#e8e8e8;}

/* ── THRESHOLD BAR ── */
.thresh-bar{background:#111;border-bottom:1px solid #1e1e1e;padding:6px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:34px;}
.thresh-group{display:flex;align-items:center;gap:3px;}
.thresh-stat-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#444;margin-right:3px;white-space:nowrap;}
.tb-chip.thresh{border-color:#1e1e1e;color:#555;font-size:9px;padding:2px 6px;}
.tb-chip.thresh.on{background:#f0ede8;color:#0a0a0a;border-color:#f0ede8;}
.thresh-divider{width:1px;height:12px;background:#222;margin:0 3px;flex-shrink:0;}

/* ── PAGE ── */
.page{max-width:800px;margin:20px auto;padding:0 16px 40px;}

/* ── BIG BANNER ── */
.banner{background:#0a0a0a;color:#fff;text-align:center;padding:13px 20px;border-radius:6px;margin-bottom:18px;}
.banner-title{font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;}

/* ── TWO COLUMN LAYOUT ── */
.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}

/* ── STAT BOX ── */
.stat-box{border:2px solid #0a0a0a;border-radius:10px;overflow:hidden;background:#fff;}
.stat-box-header{background:#0a0a0a;color:#fff;text-align:center;padding:8px 12px;}
.stat-box-title{font-size:14px;font-weight:500;letter-spacing:2px;text-transform:uppercase;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;}
.stat-box-body{padding:10px 12px;display:flex;flex-direction:column;gap:10px;}

/* ── PLAYER ROW ── */
.player-row{display:flex;align-items:center;gap:10px;}
.player-img-wrap{width:38px;height:38px;flex-shrink:0;}
.player-img{width:38px;height:38px;object-fit:cover;border-radius:3px;}
.player-img-fallback{width:38px;height:38px;border-radius:3px;background:#e8e6e2;display:flex;align-items:center;justify-content:center;}
.player-info{flex:1;min-width:0;}
.player-name{font-size:11px;font-weight:400;color:#222;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-stat{font-size:16px;line-height:1.1;margin-top:1px;}
.player-stat-cur{font-weight:800;color:#0a0a0a;}
.player-stat-sep{font-weight:400;color:#aaa;font-size:14px;}
.player-stat-tgt{font-weight:300;color:#aaa;font-size:14px;}
.player-progress{flex:1;min-width:80px;}
.pct-label{font-size:8px;font-weight:700;letter-spacing:1px;color:#555;margin-bottom:3px;text-transform:uppercase;}
.bar-track{height:10px;background:#e8e6e2;border-radius:20px;position:relative;overflow:visible;}
.bar-fill{height:10px;border-radius:20px 0 0 20px;position:absolute;top:0;left:0;transition:width 0.6s;}
.bar-dot{width:16px;height:16px;border-radius:50%;position:absolute;top:50%;transform:translateY(-50%);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.25);}
.player-est{flex-shrink:0;text-align:right;min-width:46px;}
.est-label{font-size:7px;font-weight:700;letter-spacing:1px;color:#aaa;text-transform:uppercase;}
.est-val{font-size:11px;font-weight:700;color:#0a0a0a;line-height:1.2;white-space:nowrap;}

/* ── CLIMBING SECTION ── */
.climb-section{margin-top:16px;}
.climb-banner{background:#0a0a0a;color:#fff;text-align:center;padding:8px 20px;border-radius:6px;margin-bottom:10px;}
.climb-banner-title{font-size:13px;font-weight:500;letter-spacing:2px;text-transform:uppercase;}
.climb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
.climb-box{border:2px solid #0a0a0a;border-radius:10px;overflow:hidden;background:#fff;}
.climb-box-body{padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.climb-row{display:flex;align-items:center;gap:10px;}
.climb-info{flex:1;min-width:0;}
.climb-name{font-size:11px;font-weight:700;color:#0a0a0a;}
.climb-stat-name{font-size:9px;color:#aaa;letter-spacing:0.5px;}
.climb-vals{display:flex;align-items:baseline;gap:3px;margin-top:2px;}
.climb-cur{font-size:15px;font-weight:800;color:#0a0a0a;}
.climb-sep{font-size:12px;color:#aaa;font-weight:300;}
.climb-tgt{font-size:12px;color:#aaa;font-weight:300;}
.climb-target-name{font-size:9px;color:#888;margin-top:1px;}
.climb-progress{flex:1;min-width:70px;}
.climb-badge{flex-shrink:0;text-align:right;min-width:44px;}
.climb-gap{font-size:10px;font-weight:700;white-space:nowrap;}

/* ── WAITING ── */
.waiting{color:#aaa;font-size:12px;font-style:italic;text-align:center;padding:60px 0;}
.no-items{font-size:11px;color:#ccc;font-style:italic;padding:8px 0;}

@media print{
  .toolbar,.thresh-bar{display:none!important;}
  .page{margin:0;padding:12px 14px;max-width:100%;}
  body{background:#fff;}
  @page{margin:8mm 10mm;size:A4 portrait;}
  .stat-box,.climb-box{page-break-inside:avoid;}
  .columns,.climb-grid{page-break-inside:avoid;}
}
</style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-logo">BKN</span>
  <div class="tb-divider"></div>
  <div class="tb-section">
    <span class="tb-label">Status</span>
    <button class="tb-chip on urgent"  onclick="toggleStatus('urgent',this)">Urgent</button>
    <button class="tb-chip close"      onclick="toggleStatus('close',this)">Close</button>
    <button class="tb-chip upcoming"   onclick="toggleStatus('upcoming',this)">Upcoming</button>
    <button class="tb-chip achieved"   onclick="toggleStatus('achieved',this)">Achieved</button>
  </div>
  <div class="tb-divider"></div>
  <div class="tb-section">
    <span class="tb-label">Stat</span>
    <button class="tb-chip on" onclick="toggleStat('PTS',this)">PTS</button>
    <button class="tb-chip on" onclick="toggleStat('TRB',this)">REB</button>
    <button class="tb-chip on" onclick="toggleStat('AST',this)">AST</button>
    <button class="tb-chip on" onclick="toggleStat('BLK',this)">BLK</button>
    <button class="tb-chip on" onclick="toggleStat('STL',this)">STL</button>
    <button class="tb-chip on" onclick="toggleStat('FG3M',this)">3PM</button>
    <button class="tb-chip on" onclick="toggleStat('FTM',this)">FTM</button>
    <button class="tb-chip on" onclick="toggleStat('GP',this)">Games</button>
  </div>
  <button class="print-btn" onclick="window.print()">&#x2b21; Print / Save as PDF</button>
</div>

<div class="thresh-bar" id="thresh-bar">
  <span style="font-size:9px;color:#444;letter-spacing:1px;">Waiting for data...</span>
</div>

<div class="page" id="page-root">
  <div class="waiting">Opening connection to tracker&hellip;<br><br>
    <span style="font-size:10px;">If this persists, close this tab and click Export PDF again.</span>
  </div>
</div>

<script>
var MILESTONES=[], CHASES=[], CAREER={}, STAT_NAMES={}, ROSTER=[];

var THRESHOLDS={
  PTS: [100,200,300,400,500,1000,2000,3000,4000,5000,6000,7000,8000,10000],
  TRB: [100,200,300,400,500,1000,2000,3000,4000,5000],
  AST: [100,300,400,500,1000,2000,3000,4000],
  BLK: [50,100,200,300,500,700,1000],
  STL: [50,100,200,300,500,700],
  FG3M:[50,100,200,300,500,700,1000],
  FTM: [50,100,200,300,500,700,1000,2000],
  GP:  [50,100,200,300,400,500,600]
};
var PDF_STATS=['PTS','TRB','AST','BLK','STL','FG3M','FTM','GP'];
var STAT_LABELS={PTS:'Points',TRB:'Rebounds',AST:'Assists',BLK:'Blocks',STL:'Steals',FG3M:'Three-Pointers',FTM:'Free Throws',GP:'Games Played'};
var STAT_SHORT={PTS:'PTS',TRB:'REB',AST:'AST',BLK:'BLK',STL:'STL',FG3M:'3PM',FTM:'FTM',GP:'GP'};
var STATUS_COLOR={urgent:'#e8473f',close:'#e8973f',upcoming:'#4a9eff',achieved:'#3fcf8e'};
var statusOn={urgent:true,close:false,upcoming:false,achieved:false};
var statOn={PTS:true,TRB:true,AST:true,BLK:true,STL:true,FG3M:true,FTM:true,GP:true};
var threshOn={};
var rosterMap={};

function ordinal(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function fmtV(stat,v){return stat==='3PT%'?(v*100).toFixed(1)+'%':v.toLocaleString();}

function gamesAwayText(m){
  if(m.gamesAway!=null&&m.gamesAway!==undefined){
    return m.gamesAway+(m.gamesAway===1?' game':' games');
  }
  var p=rosterMap[m.player];
  if(!p) return null;
  var gp=(p.stats&&p.stats.GP)||0;
  var val=p.stats&&p.stats[m.statKey];
  if(!gp||!val) return null;
  var rate=val/gp;
  if(rate<=0) return null;
  var games=Math.ceil(m.remaining/rate);
  return '~'+games+(games===1?' game':' games');
}

function playerImg(playerId){
  if(!playerId) return silhouette();
  var src='headshots/'+playerId+'.PNG';
  return '<img class="player-img" src="'+src+'" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'" alt="">'
    +'<div class="player-img-fallback" style="display:none">'
    +'<svg width="22" height="22" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="4" fill="#ccc"/><path d="M2 18c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="#ccc" stroke-width="1.5" fill="none"/></svg>'
    +'</div>';
}
function silhouette(){
  return '<div class="player-img-fallback">'
    +'<svg width="22" height="22" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="4" fill="#ccc"/><path d="M2 18c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="#ccc" stroke-width="1.5" fill="none"/></svg>'
    +'</div>';
}

window.opener&&window.opener.postMessage({type:'pdfReady'},'*');
setTimeout(function(){window.opener&&window.opener.postMessage({type:'pdfReady'},'*');},600);

window.addEventListener('message',function(e){
  var d=e.data;
  if(!d||d.type!=='pdfData') return;
  MILESTONES=d.milestones||[];
  CHASES=d.chases||[];
  CAREER=d.career||{};
  STAT_NAMES=d.statNames||{};
  ROSTER=d.roster||[];
  ROSTER.forEach(function(p){rosterMap[p.id]=p;});
  PDF_STATS.forEach(function(s){
    (THRESHOLDS[s]||[]).forEach(function(t){threshOn[s+'-'+t]=true;});
  });
  buildThreshBar();
  render();
});

function toggleStatus(s,btn){statusOn[s]=!statusOn[s];btn.classList.toggle('on',statusOn[s]);render();}
function toggleStat(s,btn){statOn[s]=!statOn[s];btn.classList.toggle('on',statOn[s]);buildThreshBar();render();}
function toggleThresh(key,btn){threshOn[key]=!threshOn[key];btn.classList.toggle('on',threshOn[key]);render();}

function buildThreshBar(){
  var bar=document.getElementById('thresh-bar');
  var active=PDF_STATS.filter(function(s){return statOn[s];});
  if(!active.length){bar.innerHTML='<span style="font-size:9px;color:#444;letter-spacing:1px;">Select a stat type above to see thresholds</span>';return;}
  bar.innerHTML=active.map(function(stat,i){
    var chips=(THRESHOLDS[stat]||[]).map(function(t){
      var key=stat+'-'+t,on=threshOn[key]!==false;
      return '<button class="tb-chip thresh '+(on?'on':'')+'" onclick="toggleThresh(\''+key+'\',this)">'+t.toLocaleString()+'</button>';
    }).join('');
    return (i>0?'<div class="thresh-divider"></div>':'')
      +'<div class="thresh-group"><span class="thresh-stat-lbl">'+STAT_SHORT[stat]+'</span>'+chips+'</div>';
  }).join('');
}

function msOk(m){
  if(!statusOn[m.urgency]) return false;
  if(m.statKey&&!statOn[m.statKey]) return false;
  var key=m.statKey+'-'+m.target;
  return threshOn.hasOwnProperty(key)?threshOn[key]:true;
}
function chOk(c){
  if(!statusOn[c.urgency]) return false;
  var mapped=PDF_STATS.indexOf(c.stat)>=0?c.stat:null;
  if(mapped&&!statOn[mapped]) return false;
  return true;
}

function buildPlayerRow(m){
  var col=STATUS_COLOR[m.urgency]||'#e8473f';
  var pct=Math.min(99,Math.floor(m.current/m.target*100));
  var gaTxt=gamesAwayText(m);
  var dotLeft='calc('+pct+'% - 8px)';
  // bar fill needs radius adjustment when nearly full
  var fillRadius=pct>=98?'20px':'20px 0 0 20px';
  return '<div class="player-row">'
    +'<div class="player-img-wrap">'+playerImg(m.player)+'</div>'
    +'<div class="player-info">'
      +'<div class="player-name">'+(m.playerName||m.player)+'</div>'
      +'<div class="player-stat">'
        +'<span class="player-stat-cur">'+m.current.toLocaleString()+'</span>'
        +'<span class="player-stat-sep">/</span>'
        +'<span class="player-stat-tgt">'+m.target.toLocaleString()+'</span>'
      +'</div>'
    +'</div>'
    +'<div class="player-progress">'
      +'<div class="pct-label">'+pct+'% complete</div>'
      +'<div class="bar-track">'
        +'<div class="bar-fill" style="width:'+pct+'%;background:'+col+';border-radius:'+fillRadius+'"></div>'
        +'<div class="bar-dot" style="left:'+dotLeft+';background:'+col+'"></div>'
      +'</div>'
    +'</div>'
    +(gaTxt?'<div class="player-est"><div class="est-label">Est.</div><div class="est-val">'+gaTxt+'</div></div>':'')
  +'</div>';
}

function buildStatBox(statKey, items){
  var label=STAT_LABELS[statKey]||statKey;
  return '<div class="stat-box">'
    +'<div class="stat-box-header"><div class="stat-box-title">'+label+'</div></div>'
    +'<div class="stat-box-body">'+items.map(buildPlayerRow).join('')+'</div>'
  +'</div>';
}

// Balance two columns by estimated height (each player row ~52px, header ~36px)
function balanceColumns(boxes){
  // boxes = [{key, items}]
  var ROW_H=52, HEAD_H=52, PAD=20;
  function boxH(b){ return HEAD_H + b.items.length*ROW_H + PAD; }
  var left=[], right=[], lh=0, rh=0;
  boxes.forEach(function(b){
    var h=boxH(b);
    if(lh<=rh){ left.push(b); lh+=h+12; }
    else{ right.push(b); rh+=h+12; }
  });
  return {left:left, right:right};
}

function buildClimbRow(c){
  var col=STATUS_COLOR[c.urgency]||'#888';
  var pct=(c.pctGap*100).toFixed(1);
  var rows=(CAREER[c.stat]||[]).slice().sort(function(a,b){return b[1]-a[1];});
  var below=rows[c.currentRank],base=below?below[1]:0,range=c.targetVal-base;
  var prog=range>0?Math.min(99,Math.floor((c.currentVal-base)/range*100)):99;
  var gap=c.targetVal-c.currentVal;
  var dotLeft='calc('+prog+'% - 8px)';
  var fillRadius=prog>=98?'20px':'20px 0 0 20px';
  return '<div class="climb-row">'
    +'<div class="player-img-wrap">'+playerImg(c.player)+'</div>'
    +'<div class="climb-info">'
      +'<div class="climb-name">'+c.player+'</div>'
      +'<div class="climb-stat-name">'+(STAT_NAMES[c.stat]||c.stat)+'</div>'
      +'<div class="climb-vals">'
        +'<span class="climb-cur">'+fmtV(c.stat,c.currentVal)+'</span>'
        +'<span class="climb-sep">/</span>'
        +'<span class="climb-tgt">'+fmtV(c.stat,c.targetVal)+'</span>'
      +'</div>'
      +'<div class="climb-target-name">chasing '+c.targetName+' ('+ordinal(c.targetRank)+')</div>'
    +'</div>'
    +'<div class="player-progress">'
      +'<div class="pct-label">'+prog+'% closed</div>'
      +'<div class="bar-track">'
        +'<div class="bar-fill" style="width:'+prog+'%;background:'+col+';border-radius:'+fillRadius+'"></div>'
        +'<div class="bar-dot" style="left:'+dotLeft+';background:'+col+'"></div>'
      +'</div>'
    +'</div>'
    +'<div class="player-est"><div class="est-label">Gap</div><div class="climb-gap" style="color:'+col+'">'+pct+'%</div></div>'
  +'</div>';
}

function render(){
  var root=document.getElementById('page-root');
  var fms=MILESTONES.filter(msOk);
  var fch=CHASES.filter(chOk).sort(function(a,b){return a.player.localeCompare(b.player);});

  // Group milestones by stat in PDF_STATS order
  var groups={};
  fms.forEach(function(m){
    var k=m.statKey||'Other';
    if(!groups[k]) groups[k]=[];
    groups[k].push(m);
  });
  Object.keys(groups).forEach(function(k){
    groups[k].sort(function(a,b){
      return Math.floor(b.current/b.target*100)-Math.floor(a.current/a.target*100);
    });
  });
  var orderedKeys=PDF_STATS.filter(function(k){return groups[k]&&groups[k].length;});
  Object.keys(groups).forEach(function(k){if(orderedKeys.indexOf(k)<0) orderedKeys.push(k);});
  var boxes=orderedKeys.map(function(k){return {key:k,items:groups[k]};});

  var html='';

  // Banner
  html+='<div class="banner"><div class="banner-title">Upcoming Milestones</div></div>';

  // Milestone boxes
  if(boxes.length){
    var cols=balanceColumns(boxes);
    html+='<div class="columns">';
    html+='<div style="display:flex;flex-direction:column;gap:12px;">'+cols.left.map(function(b){return buildStatBox(b.key,b.items);}).join('')+'</div>';
    html+='<div style="display:flex;flex-direction:column;gap:12px;">'+cols.right.map(function(b){return buildStatBox(b.key,b.items);}).join('')+'</div>';
    html+='</div>';
  } else {
    html+='<div class="no-items" style="text-align:center;padding:24px 0;">No milestones match the selected filters.</div>';
  }

  // Climbing section
  if(fch.length){
    // Group climbing by stat too
    var cgroups={};
    fch.forEach(function(c){
      var k=c.stat||'Other';
      if(!cgroups[k]) cgroups[k]=[];
      cgroups[k].push(c);
    });
    var ckeys=PDF_STATS.filter(function(k){return cgroups[k]&&cgroups[k].length;});
    Object.keys(cgroups).forEach(function(k){if(ckeys.indexOf(k)<0) ckeys.push(k);});
    var cboxes=ckeys.map(function(k){return {key:k,items:cgroups[k]};});
    var ccols=balanceColumns(cboxes);

    html+='<div class="climb-section">';
    html+='<div class="climb-banner"><div class="climb-banner-title">Climbing the Record Books</div></div>';
    html+='<div class="climb-grid">';
    html+='<div style="display:flex;flex-direction:column;gap:10px;">'+ccols.left.map(function(b){
      return '<div class="climb-box"><div class="stat-box-header"><div class="stat-box-title">'+(STAT_LABELS[b.key]||b.key)+'</div></div>'
        +'<div class="climb-box-body">'+b.items.map(buildClimbRow).join('')+'</div></div>';
    }).join('')+'</div>';
    html+='<div style="display:flex;flex-direction:column;gap:10px;">'+ccols.right.map(function(b){
      return '<div class="climb-box"><div class="stat-box-header"><div class="stat-box-title">'+(STAT_LABELS[b.key]||b.key)+'</div></div>'
        +'<div class="climb-box-body">'+b.items.map(buildClimbRow).join('')+'</div></div>';
    }).join('')+'</div>';
    html+='</div></div>';
  }

  root.innerHTML=html;
}
</script>
</body>
</html>
