<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upcoming Milestones — Export</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f5f5f3;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:13px;min-height:100vh;}
.toolbar{background:#0a0a0a;color:#f5f3ee;padding:14px 32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
.toolbar-logo{font-size:16px;font-weight:700;letter-spacing:3px;margin-right:8px;white-space:nowrap;}
.tb-section{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tb-divider{width:1px;height:20px;background:rgba(255,255,255,0.15);margin:0 4px;}
.tb-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#888;white-space:nowrap;}
.tb-chip{padding:4px 10px;border:1px solid #333;border-radius:3px;font-size:10px;cursor:pointer;color:#aaa;background:transparent;transition:all 0.15s;white-space:nowrap;font-family:inherit;}
.tb-chip:hover{border-color:#666;color:#fff;}
.tb-chip.on{background:#fff;color:#0a0a0a;border-color:#fff;font-weight:600;}
.tb-chip.on.urgent{background:#e8473f;border-color:#e8473f;color:#fff;}
.tb-chip.on.close{background:#e8973f;border-color:#e8973f;color:#fff;}
.tb-chip.on.upcoming{background:#4a9eff;border-color:#4a9eff;color:#fff;}
.tb-chip.on.achieved{background:#3fcf8e;border-color:#3fcf8e;color:#fff;}
.print-btn{margin-left:auto;padding:7px 18px;background:#fff;color:#0a0a0a;border:none;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;white-space:nowrap;font-family:inherit;}
.print-btn:hover{background:#e0e0e0;}
.thresh-bar{background:#111;border-bottom:1px solid #222;padding:8px 32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:38px;}
.thresh-group{display:flex;align-items:center;gap:5px;}
.thresh-stat-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#555;margin-right:2px;}
.tb-chip.thresh{border-color:#222;color:#666;font-size:9px;padding:3px 8px;}
.tb-chip.thresh.on{background:#f5f3ee;color:#0a0a0a;border-color:#f5f3ee;}
.preview{max-width:760px;margin:24px auto;padding:0 24px 60px;}
.doc{background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:36px 40px;}
.doc-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:3px solid #0a0a0a;}
.doc-title{font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;line-height:1.1;}
.doc-meta{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#aaa;margin-bottom:6px;}
.doc-sub{font-size:9px;color:#e8473f;letter-spacing:2px;margin-top:5px;text-transform:uppercase;}
.doc-url{text-align:right;font-size:9px;color:#ccc;letter-spacing:1px;}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 0;padding-bottom:5px;border-bottom:2px solid #0a0a0a;}
.sec-title{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.sec-count{font-size:10px;color:#aaa;}
table{width:100%;border-collapse:collapse;margin-top:2px;}
th{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;padding:5px 10px;text-align:left;border-bottom:1px solid #e0e0e0;font-weight:400;}
th.r{text-align:right;}
td{padding:7px 10px;border-bottom:1px solid #f0f0f0;vertical-align:top;}
.p-name{font-weight:700;font-size:13px;}
.p-sub{font-size:10px;color:#888;margin-top:1px;}
.p-val{font-size:18px;font-weight:700;line-height:1;}
.p-rem{font-size:10px;color:#888;}
.p-bar-wrap{display:flex;justify-content:space-between;margin-bottom:3px;}
.p-bar-label,.p-bar-pct{font-size:10px;}
.p-bar-pct{font-weight:600;}
.p-bar-track{height:3px;background:#eee;border-radius:2px;}
.p-bar-fill{height:3px;border-radius:2px;}
.badge{font-size:9px;padding:2px 6px;border-radius:2px;font-weight:600;letter-spacing:0.5px;}
.no-items{padding:12px 10px;font-size:11px;color:#bbb;font-style:italic;}
.doc-foot{margin-top:24px;padding-top:8px;border-top:1px solid #e8e6e0;display:flex;justify-content:space-between;font-size:8px;color:#ccc;letter-spacing:1px;}
.waiting{color:#aaa;font-size:12px;font-style:italic;text-align:center;padding:40px 0;}
@media print{
  .toolbar,.thresh-bar{display:none!important;}
  .preview{margin:0;padding:0;max-width:100%;}
  .doc{box-shadow:none;border-radius:0;padding:24px 28px;}
  @page{margin:12mm 14mm;size:A4 portrait;}
}
</style>
</head>
<body>
<div class="toolbar">
  <span class="toolbar-logo">BKN</span>
  <div class="tb-divider"></div>
  <div class="tb-section">
    <span class="tb-label">Status</span>
    <button class="tb-chip on urgent"  onclick="toggleStatus('urgent',this)">Urgent</button>
    <button class="tb-chip close"      onclick="toggleStatus('close',this)">Close</button>
    <button class="tb-chip upcoming"   onclick="toggleStatus('upcoming',this)">Upcoming</button>
    <button class="tb-chip achieved"   onclick="toggleStatus('achieved',this)">Achieved</button>
  </div>
  <div class="tb-divider"></div>
  <div class="tb-section">
    <span class="tb-label">Stat</span>
    <button class="tb-chip on" onclick="toggleStat('PTS',this)">PTS</button>
    <button class="tb-chip on" onclick="toggleStat('TRB',this)">REB</button>
    <button class="tb-chip on" onclick="toggleStat('AST',this)">AST</button>
    <button class="tb-chip on" onclick="toggleStat('BLK',this)">BLK</button>
    <button class="tb-chip on" onclick="toggleStat('STL',this)">STL</button>
    <button class="tb-chip on" onclick="toggleStat('FG3M',this)">3PM</button>
    <button class="tb-chip on" onclick="toggleStat('FTM',this)">FTM</button>
    <button class="tb-chip on" onclick="toggleStat('GP',this)">Games</button>
  </div>
  <button class="print-btn" onclick="window.print()">&#x2b21; Print / Save as PDF</button>
</div>
<div class="thresh-bar" id="thresh-bar">
  <span style="font-size:9px;color:#555;letter-spacing:1px;">Waiting for data...</span>
</div>
<div class="preview">
  <div class="doc" id="doc-preview">
    <div class="waiting">Opening connection to tracker...<br><br>
      <span style="font-size:10px;">If this message persists, close this tab and click Export PDF again.</span>
    </div>
  </div>
</div>

<script>
var MILESTONES=[], CHASES=[], CAREER={}, STAT_NAMES={};
var THRESHOLDS={
  PTS: [500,1000,2000,3000,4000,5000,6000,7000,8000,10000],
  TRB: [500,1000,2000,3000,4000,5000],
  AST: [250,500,1000,2000,3000,4000],
  BLK: [50,100,200,300,500,700,1000],
  STL: [50,100,200,300,500,700],
  FG3M:[50,100,200,300,500,700,1000],
  FTM: [50,100,200,300,500,700,1000,2000],
  GP:  [50,100,200,300,400,500,600]
};
var PDF_STATS=['PTS','TRB','AST','BLK','STL','FG3M','FTM','GP'];
var STAT_LABELS={PTS:'PTS',TRB:'REB',AST:'AST',BLK:'BLK',STL:'STL',FG3M:'3PM',FTM:'FTM',GP:'Games'};
var STATUS_COLOR={urgent:'#e8473f',close:'#e8973f',upcoming:'#4a9eff',achieved:'#3fcf8e'};
var STATUS_LABEL={urgent:'URGENT',close:'CLOSE',upcoming:'UPCOMING',achieved:'ACHIEVED'};
var DATE_STR=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
var statusOn={urgent:true,close:false,upcoming:false,achieved:false};
var statOn={PTS:true,TRB:true,AST:true,BLK:true,STL:true,FG3M:true,FTM:true,GP:true};
var threshOn={};

function ordinal(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function fmtV(stat,v){return stat==='3PT%'?(v*100).toFixed(1)+'%':v.toLocaleString();}

// Signal parent that we're ready to receive data
window.opener && window.opener.postMessage({type:'pdfReady'}, '*');

// Also try after a short delay in case parent wasn't listening yet
setTimeout(function(){
  window.opener && window.opener.postMessage({type:'pdfReady'}, '*');
}, 500);

window.addEventListener('message', function(e) {
  var d = e.data;
  if (!d || d.type !== 'pdfData') return;
  MILESTONES = d.milestones || [];
  CHASES     = d.chases     || [];
  CAREER     = d.career     || {};
  STAT_NAMES = d.statNames  || {};
  PDF_STATS.forEach(function(s){
    (THRESHOLDS[s]||[]).forEach(function(t){ threshOn[s+'-'+t]=true; });
  });
  buildThreshBar();
  render();
});

function toggleStatus(s,btn){
  statusOn[s]=!statusOn[s];
  btn.classList.toggle('on',statusOn[s]);
  render();
}
function toggleStat(s,btn){
  statOn[s]=!statOn[s];
  btn.classList.toggle('on',statOn[s]);
  buildThreshBar();
  render();
}
function toggleThresh(key,btn){
  threshOn[key]=!threshOn[key];
  btn.classList.toggle('on',threshOn[key]);
  render();
}

function buildThreshBar(){
  var bar=document.getElementById('thresh-bar');
  var active=PDF_STATS.filter(function(s){return statOn[s];});
  if(!active.length){
    bar.innerHTML='<span style="font-size:9px;color:#555;letter-spacing:1px;">Select a stat type to see thresholds</span>';
    return;
  }
  bar.innerHTML=active.map(function(stat){
    var chips=(THRESHOLDS[stat]||[]).map(function(t){
      var key=stat+'-'+t, on=threshOn[key]!==false;
      return '<button class="tb-chip thresh '+(on?'on':'')+'" onclick="toggleThresh(\''+key+'\',this)">'+t.toLocaleString()+'</button>';
    }).join('');
    return '<div class="thresh-group"><span class="thresh-stat-lbl">'+STAT_LABELS[stat]+'</span>'+chips+'</div>';
  }).join('<div style="width:1px;height:16px;background:#222;margin:0 4px;"></div>');
}

function msOk(m){
  if(!statusOn[m.urgency]) return false;
  if(m.statKey && !statOn[m.statKey]) return false;
  var key=m.statKey+'-'+m.target;
  return threshOn.hasOwnProperty(key) ? threshOn[key] : true;
}
function chOk(c){
  if(!statusOn[c.urgency]) return false;
  var mapped=PDF_STATS.indexOf(c.stat)>=0 ? c.stat : null;
  if(mapped && !statOn[mapped]) return false;
  return true;
}

function secHead(title,count){
  return '<div class="sec-head"><span class="sec-title">'+title+'</span>'
    +'<span class="sec-count">'+count+' item'+(count!==1?'s':'')+'</span></div>';
}

var thHead='<thead><tr><th>Player</th><th>Current</th><th>Progress</th><th class="r">Status</th></tr></thead>';
var noRow='<tr><td colspan="4" class="no-items">No items match the selected filters.</td></tr>';

function buildMsRow(m){
  var col=STATUS_COLOR[m.urgency]||'#888';
  var lbl=STATUS_LABEL[m.urgency]||m.urgency.toUpperCase();
  var pct=Math.min(100,Math.round(m.current/m.target*100));
  var name=m.playerName||m.player;
  return '<tr>'
    +'<td><div class="p-name">'+name+'</div><div class="p-sub">'+m.statType+'</div></td>'
    +'<td><div class="p-val">'+m.current.toLocaleString()+'</div>'
    +'<div class="p-rem">'+m.remaining.toLocaleString()+' left</div></td>'
    +'<td><div class="p-bar-wrap"><span class="p-bar-label">to '+m.target.toLocaleString()+'</span>'
    +'<span class="p-bar-pct" style="color:'+col+'">'+pct+'%</span></div>'
    +'<div class="p-bar-track"><div class="p-bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div></td>'
    +'<td style="text-align:right"><span class="badge" style="background:'+col+'20;color:'+col+'">'+lbl+'</span></td>'
    +'</tr>';
}

function buildChRow(c){
  var col=STATUS_COLOR[c.urgency]||'#888';
  var lbl=STATUS_LABEL[c.urgency]||c.urgency.toUpperCase();
  var pct=(c.pctGap*100).toFixed(1);
  var rows=(CAREER[c.stat]||[]).slice().sort(function(a,b){return b[1]-a[1];});
  var below=rows[c.currentRank], base=below?below[1]:0, range=c.targetVal-base;
  var prog=range>0?Math.min(100,Math.round((c.currentVal-base)/range*100)):99;
  var cv=fmtV(c.stat,c.currentVal), tv=fmtV(c.stat,c.targetVal);
  return '<tr>'
    +'<td><div class="p-name">'+c.player+'</div><div class="p-sub">'+(STAT_NAMES[c.stat]||c.stat)+'</div></td>'
    +'<td><div class="p-val">'+cv+'</div><div class="p-rem">'+ordinal(c.currentRank)+' all-time</div></td>'
    +'<td><div class="p-bar-wrap"><span class="p-bar-label">'+c.targetName+' ('+tv+')</span>'
    +'<span class="p-bar-pct" style="color:'+col+'">'+pct+'% gap</span></div>'
    +'<div class="p-bar-track"><div class="p-bar-fill" style="width:'+prog+'%;background:'+col+'"></div></div></td>'
    +'<td style="text-align:right"><span class="badge" style="background:'+col+'20;color:'+col+'">'+lbl+'</span></td>'
    +'</tr>';
}

function render(){
  var fms=MILESTONES.filter(msOk).sort(function(a,b){
    return (a.playerName||a.player).localeCompare(b.playerName||b.player);
  });
  var fch=CHASES.filter(chOk).sort(function(a,b){
    return a.player.localeCompare(b.player);
  });
  var activeStatuses=['urgent','close','upcoming','achieved']
    .filter(function(s){return statusOn[s];})
    .map(function(s){return STATUS_LABEL[s];})
    .join(', ') || 'None';

  document.getElementById('doc-preview').innerHTML=
    '<div class="doc-head">'
      +'<div>'
        +'<div class="doc-meta">Brooklyn Nets &middot; Media Intelligence &middot; '+DATE_STR+'</div>'
        +'<div class="doc-title">Upcoming Milestones</div>'
        +'<div class="doc-sub">'+activeStatuses+' &middot; alphabetical</div>'
      +'</div>'
      +'<div class="doc-url">benbagley17.github.io/nets-tracker</div>'
    +'</div>'
    +secHead('Franchise Milestones', fms.length)
    +'<table>'+thHead+'<tbody>'+(fms.length ? fms.map(buildMsRow).join('') : noRow)+'</tbody></table>'
    +secHead('Climbing the Record Books', fch.length)
    +'<table>'+thHead+'<tbody>'+(fch.length ? fch.map(buildChRow).join('') : noRow)+'</tbody></table>'
    +'<div class="doc-foot">'
      +'<span>BROOKLYN NETS &middot; MEDIA INTELLIGENCE</span>'
      +'<span>UPCOMING MILESTONES REPORT</span>'
    +'</div>';
}
</script>
</body>
</html>
